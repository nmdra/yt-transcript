[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "yt-transcript"
version = "1.2.0"
description = "English YouTube captions with deterministic cleanup and optional model editing"
readme = "README.md"
requires-python = ">=3.14.7"
license = "MIT"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["yt-dlp[default]>=2026.8.19", "PyYAML>=6.0.3"]

[project.optional-dependencies]
mcp = ["mcp>=2.3.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.2"]

[project.scripts]
yt-transcript = "yt_transcript.cli:main"

[project.urls]
Repository = "https://github.com/nmdra/yt-transcript"
Changelog = "https://github.com/nmdra/yt-transcript/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: explicitly enabled live checks"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_transcript"]
