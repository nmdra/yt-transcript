name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv
        # astral-sh/setup-uv v10.2.0
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.8.13'
          enable-cache: false
      - name: Install pinned Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: uv sync --locked --extra mcp
      - name: Validate release versions and extract notes
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked --extra mcp python scripts/release.py "$RELEASE_TAG" \
            --notes dist/release-notes.md --output "$GITHUB_OUTPUT"
      - name: Run offline acceptance checks
        run: |
          uv run --locked --extra mcp pytest -m 'not integration' -q \
            -W error::pytest.PytestUnraisableExceptionWarning
          uv run --locked --extra mcp ruff check .
          uv run --locked --extra mcp ruff format --check .
          npx --yes pyright@1.1.412 --project pyrightconfig.json
          git diff --exit-code
      - name: Build wheel and source archive
        run: |
          printf 'hatchling==1.32.4\n' > "$RUNNER_TEMP/build-constraints.txt"
          uv build --build-constraints "$RUNNER_TEMP/build-constraints.txt"
          (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
      - name: Upload release artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download checked artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dist
          path: dist/
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish release without changing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          case "$IS_PRERELEASE" in
            true) flags=(--prerelease --latest=false) ;;
            false) flags=(--latest) ;;
            *) echo 'Invalid prerelease flag'; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "yt-transcript $RELEASE_TAG" \
            --notes-file dist/release-notes.md "${flags[@]}"
