# All supported yt-transcript TOML settings are shown below.
# Active values match the built-in defaults. Optional overrides stay commented.
#
# Default location: ~/.config/yt-transcript/config.toml
# An absolute XDG_CONFIG_HOME replaces ~/.config in that location.
# Use --config PATH to select a different file, or --no-config to skip loading.
# Explicit CLI flags override TOML values. Project files are not auto-loaded.
# Unknown tables/keys, invalid types, and files larger than 64 KiB are rejected.
# Keep credentials out of this file; use Pi-managed credentials, OPENROUTER_API_KEY, or DEEPSEEK_API_KEY in the environment.

[output]
# Default: "markdown". Allowed: "markdown", "raw", "raw-vtt".
# markdown: model-edited Markdown; sends caption text to the configured provider.
# raw: deterministic plain text, with no model calls.
# raw-vtt: downloaded VTT bytes unchanged, with no model calls.
# CLI --raw and --raw-vtt override this setting.
mode = "markdown"

# Default: false. Allowed: true or false.
# Add caption-source and safe diagnostics to stderr, never transcript stdout.
# CLI --verbose overrides this setting to true.
verbose = false

[formatting]
# Default: "pi". Allowed: "pi", "openrouter", "deepseek".
# Direct providers require an explicit model below and their API key in the process environment.
# OpenRouter: OPENROUTER_API_KEY. DeepSeek: DEEPSEEK_API_KEY.
# Never put the API key in this file. MCP uses the server-selected backend.
provider = "pi"
# Default: "standard". Allowed: "standard", "focused", "summarized".
# Focused removes clearly separable non-substantive material, not a summary.
# Summarized targets one 400–700-word overview, shorter for short videos.
# Multiple input chunks use factual notes plus one final synthesis call.
# All Markdown modes allow only clear ordinary-word spelling corrections from caption context.
# Keep uncertain words, names, technical terms, numbers, URLs, code, and commands unchanged.
# These model instructions do not guarantee spelling quality or factual accuracy.
# CLI --editorial-mode overrides this. Raw and MCP plain_text ignore this.
# Explicit MCP markdown uses the server-configured editorial mode.
editorial_mode = "standard"

# Optional strict Boolean. Omitted: summarized requests thinking; standard/focused
# preserve Pi/OpenRouter defaults and disable DeepSeek thinking. Explicit false always wins.
# Explicit true requests thinking at thinking_level, or medium when the level is omitted.
# thinking = false
# Optional scalar string: "low", "medium", or "high". Default when enabled: "medium".
# Level alone is valid for summarized; standard/focused require thinking = true.
# With thinking = false, a valid configured level is inactive. DeepSeek maps medium to high.
# Thinking can increase cost and latency and compete with visible output tokens.
# It does not increase token limits automatically or guarantee summary fidelity.
# thinking_level = "medium"

# Default: 12000. Allowed: integers from 1000 through 200000.
# Maximum source payload characters, including chapter/segment or summary-source JSON framing.
# This is not a token/context-window limit.
# Smaller values usually increase invocation count, latency, and possible cost.
chunk_chars = 12000

# Default: 50000. Allowed: integers from 1000 through 500000.
# Multi-chunk summarized mode only: maximum synthesis input characters, including JSON framing.
# Independent of source chunk_chars; also determines each chunk's hard factual-note allocation.
# Single-chunk summaries and standard/focused modes do not use this allowance.
# This is not a token limit. Select a model with enough context for this input and prompts.
# Larger values do not guarantee model compliance; insufficient capacity fails before model calls.
summary_synthesis_chars = 50000

# Default: 600. Allowed: integers from 1 through 3600.
# Deadline in seconds for each model invocation, not for the complete transcript.
# A timeout cannot undo provider work or charges already incurred.
timeout_seconds = 600

# Optional. Default: omitted, meaning no wrapper invocation cap.
# Allowed: integers from 1 through 1000; zero is not an unlimited value.
# Reject formatting before the first model call if planning exceeds this cap.
# Summarized counts the final synthesis call too; one input chunk uses one call.
# Preview reports exceedance without calling a model. CLI --max-chunks overrides it.
# Pi/provider retries can add requests, so this is not a hard billing cap.
# max_chunks = 20

# Optional for Pi. Default: omitted, preserving Pi's configured default model.
# Required for OpenRouter and DeepSeek. Use an exact model ID for the selected provider.
# DeepSeek examples: "deepseek-flash", "deepseek-v4-pro"; not a permanent allowlist.
# Allowed: a nonempty model selector; a provider/model-id is recommended.
# Replace the placeholder with a real selector before uncommenting.
# Empty strings are invalid. CLI --model overrides this setting.
# model = "provider/model-id"

# Raw modes ignore formatting settings after validating the complete TOML file.
# MCP plain_text ignores formatting settings. Explicit markdown uses these settings.
# MCP defaults to max_chunks=20 when omitted; per-call timeout is at most 120 seconds.
# The total MCP deadline is separate; see [mcp] below.
# Help/version bypass TOML. Doctor reads selected config without network requests.
# URL, output path, preview, doctor, no-clobber, and MCP startup are CLI-only.

[openrouter]
# Default: 16384 tokens per model call. Allowed: integers from 1 through 131072.
# Sent as max_tokens. Reasoning tokens can consume this output allowance.
# The selected model must support the limit; a larger allowance does not guarantee completion.
# Incomplete output fails without automatic retry, repair, or partial publication.
max_output_tokens = 16384

[deepseek]
# Default: 16384 tokens per model call. Allowed: integers from 1 through 393216.
# Sent as max_tokens. Thinking can consume the same allowance; no automatic increase.
# The model must support the limit. Incomplete output fails without retry, repair, or partial output.
max_output_tokens = 16384

# Default: "en". Allowed: one BCP-47-shaped tag of 2-63 characters, with letters
# and digits separated by hyphens, for example "en", "en-US", "fr", or "zh-Hans".
# The tool prefers a native track in that language. When only a YouTube-provided
# translated track exists, the tool uses it and reports the translation in verbose
# output, in file metadata, and in JSON. The tool never translates locally.
# CLI --language overrides this setting. MCP uses this server-selected value.
[captions]
language = "en"

# Source caption cache shared by CLI and MCP.
# Local snapshots are private source data; model-generated Markdown is not cached.
# Disable caching to fetch each time. Paging requires available cache storage.
[cache]
enabled = true
# Default: empty string keeps the existing XDG_CACHE_HOME/HOME cache location.
# Optional absolute SQLite database filename; ~ expands to the user home directory.
# Use a dedicated private parent directory. Existing unsafe paths are rejected, not chmodded.
# Example: path = "~/private/yt-transcript/transcripts.db"
path = ""
# Allowed: integer 1–168. Expiration is based on creation, not last access.
ttl_hours = 24
# Allowed: integer 10–500. MiB of retained payload; database files can be larger.
max_size_mb = 50

[mcp]
# Default: 300. Allowed: integers from 300 through 3600.
# Total Markdown worker deadline, including caption fetching and all model calls.
# Plain text always uses 300 seconds. CLI ignores this setting after validation.
# Opt in to 1800 for longer work and set a supported client timeout to 1830.
# Longer work can incur more charges; completion is not guaranteed.
markdown_timeout_seconds = 300

[sponsorblock]
# Optional strict boolean. Unset: CLI off; MCP filtered mode on.
# Explicit false disables lookup in both interfaces. MCP full always skips it.
# CLI --sponsorblock / --no-sponsorblock override this setting.
# enabled = false

# Nonempty unique list. Also allowed: intro, outro, preview.
# Categories such as filler, music_offtopic, and full labels are not supported.
categories = ["sponsor", "selfpromo", "interaction"]

# Default: 10. Allowed: integers from 1 through 30.
# Socket-operation timeout, not the complete workflow deadline.
timeout_seconds = 10

# Lookup sends a four-character video-ID hash prefix to the official service.
# Expected lookup failures keep captions and report a safe warning.
# API/data license: CC BY-NC-SA 4.0 unless separate permission is granted.
